spring.application.name=budgeting

spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT

app.voice.transcription-model=whisper-1
app.voice.transcription-language=pt
app.voice.transcription-prompt=Áudio em português brasileiro. \
    Áudio contém descrição de gastos financeiros. \
    As frases geralmente contém: \
    - um valor em reais (número + "reais"); \
    - uma ação (gostei, paguei, comprei); \
    - um local ou estabelecimento (mercado, farmácia, restaurante, loja, etc.). \

app.voice.speech-model=gpt-4o-mini-tts
app.voice.speech-voice=nova
app.voice.speech-speed=1.2
app.voice.speech-format=mp3
app.voice.api-base-url=${OPENAI_API_BASE_URL:https://api.openai.com}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}
app.audio.storage-path=${AUDIO_STORAGE_PATH:./data/audio}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

logging.level.org.springframework.ai=INFO